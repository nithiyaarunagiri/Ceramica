<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>Ceramica · Login</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40' fill='none'%3E%3Cpath d='M8 16h24v10a8 8 0 0 1-8 8h-8a8 8 0 0 1-8-8V16z' fill='%233a7d6b' fill-opacity='0.2'/%3E%3Cpath d='M8 16h24v10a8 8 0 0 1-8 8h-8a8 8 0 0 1-8-8V16z' stroke='%233a7d6b' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M6 16h28' stroke='%233a7d6b' stroke-width='2.5' stroke-linecap='round'/%3E%3Cpath d='M16 16c0-3 1.8-5 4-5s4 2 4 5' stroke='%233a7d6b' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='20' cy='10' r='1.8' fill='%233a7d6b'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script>
    /* Prevent theme flash on page load */
    (function() {
      try {
        if (localStorage.getItem('ceramica-theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
        if (localStorage.getItem('ceramica-rtl') === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
        }
      } catch(e) {}
    })();
  </script>
  <style>
    /* ===== RESET & BASE ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f8faf9;
      --bg-dark: #1e2b2a;
      --text-primary: #1e2b2a;
      --text-secondary: #4a5a58;
      --text-light: #e8e0d8;
      --border-color: #dce5e2;
      --accent: #3a7d6b;
      --accent-light: #5a9a87;
      --accent-dark: #2a5f50;
      --shadow: rgba(0, 0, 0, 0.06);
      --card-bg: #ffffff;
      --section-bg: #f8faf9;
      --transition: 0.3s ease;
      --input-bg: #ffffff;
    }

    [data-theme="dark"] {
      --bg-primary: #141d1c;
      --bg-secondary: #1e2b2a;
      --text-primary: #e8f0ed;
      --text-secondary: #a8bdb8;
      --text-light: #5f5349;
      --border-color: #2a3d3a;
      --shadow: rgba(0, 0, 0, 0.3);
      --card-bg: #1e2b2a;
      --section-bg: #141d1c;
      --input-bg: #1e2b2a;
    }

    [dir="rtl"] { text-align: right; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      transition: background var(--transition), color var(--transition);
      overflow: hidden;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ===== LOGIN PAGE CONTAINER ===== */
    .login-page {
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: var(--bg-primary);
      transition: background var(--transition);
      position: relative;
    }

    /* ===== TOGGLES - OUTSIDE THE BOX ===== */
    .toggles-outer {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
      z-index: 100;
    }
    [dir="rtl"] .toggles-outer {
      right: auto;
      left: 20px;
    }

    .toggles-outer .toggle-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 50%;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-primary);
      font-size: 0.65rem;
      font-weight: 600;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 8px var(--shadow);
    }
    .toggles-outer .toggle-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }
    .toggles-outer .toggle-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .toggles-outer .toggle-btn i {
      font-size: 0.95rem;
    }

    /* ===== LOGIN BOX ===== */
    .login-box {
      background: var(--card-bg);
      border-radius: 28px;
      padding: 2rem 2.2rem 1.8rem;
      width: 100%;
      max-width: 400px;
      border: 1px solid var(--border-color);
      box-shadow: 0 12px 40px var(--shadow);
      transition: background var(--transition), border-color var(--transition);
    }

    /* ===== NEW LOGO WITH POT SVG ===== */
    .login-box .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-primary);
      text-decoration: none;
      transition: color var(--transition);
      margin-bottom: 0.1rem;
      text-align: center;
    }
    .login-box .logo span {
      color: var(--accent);
      font-weight: 300;
    }
    .login-box .logo .logo-mark {
      color: var(--accent);
      flex-shrink: 0;
      transition: transform 0.3s ease;
    }
    .login-box .logo:hover .logo-mark {
      transform: rotate(-6deg);
    }
    [data-theme="dark"] .login-box .logo {
      color: #e8f0ed;
    }

    .login-box .logo-sub {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 1.2rem;
    }

    /* ===== FORM GROUP ===== */
    .login-box .form-group {
      margin-bottom: 0.9rem;
    }
    .login-box .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.8rem;
      color: var(--text-primary);
      margin-bottom: 0.2rem;
    }
    .login-box .form-group input {
      width: 100%;
      padding: 0.6rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      background: var(--input-bg);
      color: var(--text-primary);
      transition: 0.2s;
      outline: none;
    }
    .login-box .form-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(58, 125, 107, 0.1);
    }

    /* ===== PASSWORD FIELD WITH EYE ICON ===== */
    .login-box .form-group .password-wrapper {
      position: relative;
      width: 100%;
    }
    .login-box .form-group .password-wrapper input {
      width: 100%;
      padding: 0.6rem 2.5rem 0.6rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      background: var(--input-bg);
      color: var(--text-primary);
      transition: 0.2s;
      outline: none;
    }
    .login-box .form-group .password-wrapper input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(58, 125, 107, 0.1);
    }
    .login-box .form-group .password-wrapper .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 1rem;
      padding: 4px;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-box .form-group .password-wrapper .toggle-password:hover {
      color: var(--accent);
    }
    [dir="rtl"] .login-box .form-group .password-wrapper .toggle-password {
      right: auto;
      left: 12px;
    }
    [dir="rtl"] .login-box .form-group .password-wrapper input {
      padding: 0.6rem 1rem 0.6rem 2.5rem;
    }

    .login-box .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      font-size: 0.8rem;
    }
    .login-box .form-options .remember {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .login-box .form-options .remember input {
      width: 15px;
      height: 15px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .login-box .form-options .remember label {
      color: var(--text-secondary);
      cursor: pointer;
    }
    .login-box .form-options .forgot {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      transition: 0.2s;
      font-size: 0.8rem;
    }
    .login-box .form-options .forgot:hover {
      color: var(--accent-dark);
    }

    .login-box .login-btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.7rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.25s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .login-box .login-btn:hover {
      background: var(--accent-dark);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(58, 125, 107, 0.3);
    }

    .login-box .signup-link {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .login-box .signup-link a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      transition: 0.2s;
    }
    .login-box .signup-link a:hover {
      color: var(--accent-dark);
    }

    /* ===== SOCIAL DIVIDER ===== */
    .login-box .social-divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1rem 0 0.8rem;
    }
    .login-box .social-divider .line {
      flex: 1;
      height: 1px;
      background: var(--border-color);
    }
    .login-box .social-divider .text {
      font-size: 0.75rem;
      color: var(--text-secondary);
      white-space: nowrap;
      text-transform: uppercase;
    }

    /* ===== SOCIAL BUTTONS ===== */
    .login-box .social-buttons {
      display: flex;
      gap: 0.8rem;
    }
    
    .login-box .social-buttons .social-btn-google {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0.6rem;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.25s;
      text-decoration: none;
      font-family: 'Inter', sans-serif;
      border: 2px solid var(--accent);
      background: transparent;
      color: var(--accent);
    }
    .login-box .social-buttons .social-btn-google:hover {
      background: var(--accent);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(58, 125, 107, 0.2);
    }
    .login-box .social-buttons .social-btn-google .google-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .login-box .social-buttons .social-btn-apple {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0.6rem;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.25s;
      text-decoration: none;
      font-family: 'Inter', sans-serif;
      border: 2px solid var(--accent);
      background: var(--accent);
      color: #fff;
    }
    .login-box .social-buttons .social-btn-apple:hover {
      background: var(--accent-dark);
      border-color: var(--accent-dark);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(58, 125, 107, 0.3);
    }
    .login-box .social-buttons .social-btn-apple .apple-icon {
      font-size: 1.1rem;
      color: #fff;
    }

    [data-theme="dark"] .login-box .social-buttons .social-btn-google {
      border-color: var(--accent-light);
      color: var(--accent-light);
    }
    [data-theme="dark"] .login-box .social-buttons .social-btn-google:hover {
      background: var(--accent-light);
      color: #fff;
    }
    [data-theme="dark"] .login-box .social-buttons .social-btn-apple {
      background: var(--accent-light);
      border-color: var(--accent-light);
      color: #fff;
    }
    [data-theme="dark"] .login-box .social-buttons .social-btn-apple:hover {
      background: var(--accent);
      border-color: var(--accent);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      .login-box {
        padding: 1.5rem 1.2rem 1.5rem;
        max-width: 100%;
        border-radius: 20px;
      }
      .login-box .logo {
        font-size: 1.6rem;
      }
      .login-box .logo .logo-mark {
        width: 28px;
        height: 28px;
      }
      .toggles-outer {
        top: 12px;
        right: 12px;
        gap: 6px;
      }
      .toggles-outer .toggle-btn {
        width: 34px;
        height: 34px;
        font-size: 0.55rem;
      }
      .toggles-outer .toggle-btn i {
        font-size: 0.8rem;
      }
      .login-box .form-options {
        flex-direction: column;
        gap: 0.5rem;
        align-items: flex-start;
      }
      .login-box .social-buttons {
        flex-direction: column;
        gap: 0.6rem;
      }
      [dir="rtl"] .toggles-outer {
        right: auto;
        left: 12px;
      }
    }

    @media (max-width: 360px) {
      .login-box {
        padding: 1.2rem 0.8rem 1.2rem;
      }
      .login-box .logo {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>

  <!-- ===== TOGGLES - OUTSIDE THE BOX ===== -->
  <div class="toggles-outer">
    <button class="toggle-btn" onclick="toggleRTL()" id="rtlBtn" title="Toggle RTL">
      <span id="rtlLabel">RTL</span>
    </button>
    <button class="toggle-btn" onclick="toggleTheme()" id="themeToggle" title="Toggle Dark/Light Mode">
      <i class="fas fa-moon"></i>
    </button>
  </div>

  <!-- ===== LOGIN PAGE ===== -->
  <div class="login-page">
    <div class="login-box">
      <!-- Logo (NEW) -->
      <a href="index.html" class="logo">
        <svg class="logo-mark" viewBox="0 0 40 40" width="32" height="32" xmlns="http://www.w3.org/2000/svg" fill="none">
          <path d="M8 16h24v10a8 8 0 0 1-8 8h-8a8 8 0 0 1-8-8V16z" fill="currentColor" fill-opacity="0.15"/>
          <path d="M8 16h24v10a8 8 0 0 1-8 8h-8a8 8 0 0 1-8-8V16z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M6 16h28" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M16 16c0-3 1.8-5 4-5s4 2 4 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="20" cy="10" r="1.8" fill="currentColor"/>
          <path d="M4 20h4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M32 20h4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        Ceram<span>ica</span>
      </a>
      <p class="logo-sub">Sign in to your account</p>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="return handleLogin(event)">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="Enter your password" required>
            <button type="button" class="toggle-password" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
              <i class="fas fa-eye" id="passwordToggleIcon"></i>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember">
            <input type="checkbox"> <span>Remember me</span>
          </label>
          <a href="#" class="forgot">Forgot Password?</a>
        </div>

        <button type="submit" class="login-btn">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </button>
      </form>

      <p class="signup-link">
        Don't have an account? <a href="signup.html">Sign Up</a>
      </p>

      <!-- Social Divider -->
      <div class="social-divider">
        <span class="line"></span>
        <span class="text">or continue with</span>
        <span class="line"></span>
      </div>

      <!-- Social Buttons -->
      <div class="social-buttons">
        <button class="social-btn-google" onclick="socialLogin('google')">
          <svg class="google-icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
            <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
            <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
            <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
            <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
          </svg>
          Google
        </button>
        <button class="social-btn-apple" onclick="socialLogin('apple')">
          <i class="fab fa-apple apple-icon"></i> Apple
        </button>
      </div>
    </div>
  </div>

  <!-- ===== JAVASCRIPT ===== -->
  <script>
    /* ===== THEME + RTL PERSISTENCE ===== */
    let darkMode = localStorage.getItem('ceramica-theme') === 'dark';
    let rtlMode = localStorage.getItem('ceramica-rtl') === 'rtl';

    function toggleTheme() {
      darkMode = !darkMode;
      const themeIcon = document.getElementById('themeToggle').querySelector('i');
      if (darkMode) {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('ceramica-theme', 'dark');
        themeIcon.className = 'fas fa-sun';
      } else {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('ceramica-theme', 'light');
        themeIcon.className = 'fas fa-moon';
      }
    }

    function toggleRTL() {
      rtlMode = !rtlMode;
      const rtlLabel = document.getElementById('rtlLabel');
      if (rtlMode) {
        document.documentElement.setAttribute('dir', 'rtl');
        localStorage.setItem('ceramica-rtl', 'rtl');
        rtlLabel.textContent = 'LTR';
      } else {
        document.documentElement.removeAttribute('dir');
        localStorage.setItem('ceramica-rtl', 'ltr');
        rtlLabel.textContent = 'RTL';
      }
    }

    // ===== PASSWORD VISIBILITY TOGGLE =====
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const toggleIcon = document.getElementById('passwordToggleIcon');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.className = 'fas fa-eye-slash';
      } else {
        passwordInput.type = 'password';
        toggleIcon.className = 'fas fa-eye';
      }
    }

    // ===== LOGIN FORM HANDLER =====
    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      if (email && password) {
        window.location.href = 'index.html';
      } else {
        alert('Please fill in all fields.');
      }
      return false;
    }

    // ===== SOCIAL LOGIN HANDLER =====
    function socialLogin(provider) {
      alert('You are signing in with ' + provider.charAt(0).toUpperCase() + provider.slice(1) + '. This feature is coming soon!');
    }

    // ===== SYNC ICONS ON LOAD =====
    window.addEventListener('load', function() {
      if (document.documentElement.getAttribute('data-theme') === 'dark') {
        document.getElementById('themeToggle').querySelector('i').className = 'fas fa-sun';
      }
      if (document.documentElement.getAttribute('dir') === 'rtl') {
        document.getElementById('rtlLabel').textContent = 'LTR';
      }
    });
  </script>

</body>
</html>

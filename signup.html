<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>Ceramica · Sign Up</title>
  <link rel="icon" type="image/jpeg" href="images/gift-hero.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ===== RESET & BASE ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f8faf9;
      --bg-dark: #1e2b2a;
      --text-primary: #1e2b2a;
      --text-secondary: #4a5a58;
      --text-light: #e8e0d8;
      --border-color: #dce5e2;
      --accent: #3a7d6b;
      --accent-light: #5a9a87;
      --accent-dark: #2a5f50;
      --shadow: rgba(0, 0, 0, 0.06);
      --card-bg: #ffffff;
      --section-bg: #f8faf9;
      --transition: 0.3s ease;
      --input-bg: #ffffff;
    }

    [data-theme="dark"] {
      --bg-primary: #141d1c;
      --bg-secondary: #1e2b2a;
      --text-primary: #e8f0ed;
      --text-secondary: #a8bdb8;
      --text-light: #5f5349;
      --border-color: #2a3d3a;
      --shadow: rgba(0, 0, 0, 0.3);
      --card-bg: #1e2b2a;
      --section-bg: #141d1c;
      --input-bg: #1e2b2a;
    }

    [dir="rtl"] { text-align: right; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      transition: background var(--transition), color var(--transition);
      overflow: hidden;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ===== SIGNUP PAGE CONTAINER ===== */
    .signup-page {
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: var(--bg-primary);
      transition: background var(--transition);
      position: relative;
    }

    /* ===== TOGGLES - OUTSIDE THE BOX ===== */
    .toggles-outer {
      position: fixed;
      top: 15px;
      right: 15px;
      display: flex;
      gap: 8px;
      z-index: 100;
    }
    [dir="rtl"] .toggles-outer {
      right: auto;
      left: 15px;
    }

    .toggles-outer .toggle-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 50%;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-primary);
      font-size: 0.55rem;
      font-weight: 600;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 8px var(--shadow);
    }
    .toggles-outer .toggle-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }
    .toggles-outer .toggle-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .toggles-outer .toggle-btn i {
      font-size: 0.85rem;
    }

    /* ===== SIGNUP BOX ===== */
    .signup-box {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 1.2rem 1.8rem 1.2rem;
      width: 100%;
      max-width: 400px;
      border: 1px solid var(--border-color);
      box-shadow: 0 12px 40px var(--shadow);
      transition: background var(--transition), border-color var(--transition);
      max-height: 98vh;
      overflow-y: auto;
    }
    .signup-box::-webkit-scrollbar {
      width: 3px;
    }
    .signup-box::-webkit-scrollbar-track {
      background: transparent;
    }
    .signup-box::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 10px;
    }

    /* Logo */
    .signup-box .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-primary);
      text-decoration: none;
      transition: color var(--transition);
      margin-bottom: 0.05rem;
      text-align: center;
    }
    .signup-box .logo span {
      color: var(--accent);
      font-weight: 300;
    }
    .signup-box .logo i {
      color: var(--accent);
      font-size: 1.3rem;
    }
    [data-theme="dark"] .signup-box .logo {
      color: #e8f0ed;
    }

    .signup-box .logo-sub {
      text-align: center;
      font-size: 0.7rem;
      color: var(--text-secondary);
      margin-bottom: 0.8rem;
    }

    /* ===== FORM GROUP ===== */
    .signup-box .form-group {
      margin-bottom: 0.5rem;
    }
    .signup-box .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.7rem;
      color: var(--text-primary);
      margin-bottom: 0.15rem;
    }
    .signup-box .form-group input {
      width: 100%;
      padding: 0.45rem 0.8rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      background: var(--input-bg);
      color: var(--text-primary);
      transition: 0.2s;
      outline: none;
    }
    .signup-box .form-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(58, 125, 107, 0.1);
    }

    /* ===== PASSWORD FIELD WITH EYE ICON ===== */
    .signup-box .form-group .password-wrapper {
      position: relative;
      width: 100%;
    }
    .signup-box .form-group .password-wrapper input {
      width: 100%;
      padding: 0.45rem 2.2rem 0.45rem 0.8rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      background: var(--input-bg);
      color: var(--text-primary);
      transition: 0.2s;
      outline: none;
    }
    .signup-box .form-group .password-wrapper input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(58, 125, 107, 0.1);
    }
    .signup-box .form-group .password-wrapper .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 2px;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .signup-box .form-group .password-wrapper .toggle-password:hover {
      color: var(--accent);
    }
    [dir="rtl"] .signup-box .form-group .password-wrapper .toggle-password {
      right: auto;
      left: 10px;
    }
    [dir="rtl"] .signup-box .form-group .password-wrapper input {
      padding: 0.45rem 0.8rem 0.45rem 2.2rem;
    }

    /* ===== TERMS CHECKBOX ===== */
    .signup-box .form-group .checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-top: 0.1rem;
    }
    .signup-box .form-group .checkbox-group input {
      width: 14px;
      height: 14px;
      min-width: 14px;
      accent-color: var(--accent);
      cursor: pointer;
      margin-top: 2px;
    }
    .signup-box .form-group .checkbox-group label {
      font-weight: 400;
      font-size: 0.7rem;
      color: var(--text-secondary);
      cursor: pointer;
      margin-bottom: 0;
      line-height: 1.4;
    }
    .signup-box .form-group .checkbox-group label a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    .signup-box .form-group .checkbox-group label a:hover {
      color: var(--accent-dark);
    }

    .signup-box .signup-btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.55rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.25s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 0.2rem;
    }
    .signup-box .signup-btn:hover {
      background: var(--accent-dark);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(58, 125, 107, 0.3);
    }

    .signup-box .login-link {
      text-align: center;
      margin-top: 0.6rem;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }
    .signup-box .login-link a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      transition: 0.2s;
    }
    .signup-box .login-link a:hover {
      color: var(--accent-dark);
    }

    /* ===== SOCIAL DIVIDER ===== */
    .signup-box .social-divider {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin: 0.6rem 0 0.5rem;
    }
    .signup-box .social-divider .line {
      flex: 1;
      height: 1px;
      background: var(--border-color);
    }
    .signup-box .social-divider .text {
      font-size: 0.6rem;
      color: var(--text-secondary);
      white-space: nowrap;
      text-transform: uppercase;
    }

    /* ===== SOCIAL BUTTONS ===== */
    .signup-box .social-buttons {
      display: flex;
      gap: 0.6rem;
    }
    
    /* Google Button - Outline */
    .signup-box .social-buttons .social-btn-google {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0.45rem;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.25s;
      text-decoration: none;
      font-family: 'Inter', sans-serif;
      border: 2px solid var(--accent);
      background: transparent;
      color: var(--accent);
    }
    .signup-box .social-buttons .social-btn-google:hover {
      background: var(--accent);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(58, 125, 107, 0.2);
    }
    .signup-box .social-buttons .social-btn-google .google-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    /* Apple Button - Filled Green */
    .signup-box .social-buttons .social-btn-apple {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0.45rem;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.25s;
      text-decoration: none;
      font-family: 'Inter', sans-serif;
      border: 2px solid var(--accent);
      background: var(--accent);
      color: #fff;
    }
    .signup-box .social-buttons .social-btn-apple:hover {
      background: var(--accent-dark);
      border-color: var(--accent-dark);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(58, 125, 107, 0.3);
    }
    .signup-box .social-buttons .social-btn-apple .apple-icon {
      font-size: 1rem;
      color: #fff;
    }

    /* Dark Mode Support */
    [data-theme="dark"] .signup-box .social-buttons .social-btn-google {
      border-color: var(--accent-light);
      color: var(--accent-light);
    }
    [data-theme="dark"] .signup-box .social-buttons .social-btn-google:hover {
      background: var(--accent-light);
      color: #fff;
    }
    [data-theme="dark"] .signup-box .social-buttons .social-btn-apple {
      background: var(--accent-light);
      border-color: var(--accent-light);
      color: #fff;
    }
    [data-theme="dark"] .signup-box .social-buttons .social-btn-apple:hover {
      background: var(--accent);
      border-color: var(--accent);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      .signup-box {
        padding: 1rem 1.2rem 1rem;
        max-width: 100%;
        border-radius: 18px;
        max-height: 95vh;
      }
      .signup-box .logo {
        font-size: 1.4rem;
      }
      .signup-box .logo i {
        font-size: 1.1rem;
      }
      .toggles-outer {
        top: 10px;
        right: 10px;
        gap: 5px;
      }
      .toggles-outer .toggle-btn {
        width: 30px;
        height: 30px;
        font-size: 0.5rem;
      }
      .toggles-outer .toggle-btn i {
        font-size: 0.7rem;
      }
      .signup-box .social-buttons {
        flex-direction: column;
        gap: 0.4rem;
      }
      [dir="rtl"] .toggles-outer {
        right: auto;
        left: 10px;
      }
    }

    @media (max-width: 360px) {
      .signup-box {
        padding: 0.8rem 0.8rem 0.8rem;
        border-radius: 14px;
      }
      .signup-box .logo {
        font-size: 1.2rem;
      }
      .signup-box .form-group input {
        padding: 0.35rem 0.6rem;
        font-size: 0.7rem;
      }
      .signup-box .signup-btn {
        padding: 0.4rem;
        font-size: 0.7rem;
      }
    }

    /* ===== SCROLLBAR FOR FIREFOX ===== */
    .signup-box {
      scrollbar-width: thin;
      scrollbar-color: var(--accent) transparent;
    }
  </style>
</head>
<body>

  <!-- ===== TOGGLES - OUTSIDE THE BOX ===== -->
  <div class="toggles-outer">
    <button class="toggle-btn" onclick="toggleRTL()" id="rtlBtn" title="Toggle RTL">
      <span id="rtlLabel">RTL</span>
    </button>
    <button class="toggle-btn" onclick="toggleTheme()" id="themeToggle" title="Toggle Dark/Light Mode">
      <i class="fas fa-moon"></i>
    </button>
  </div>

  <!-- ===== SIGNUP PAGE ===== -->
  <div class="signup-page">
    <div class="signup-box">
      <!-- Logo -->
      <a href="index.html" class="logo">
        <i class="fas fa-utensils"></i>Ceram<span>ica</span>
      </a>
      <p class="logo-sub">Create your account</p>

      <!-- Signup Form -->
      <form id="signupForm" onsubmit="return handleSignup(event)">
        <div class="form-group">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" placeholder="Enter your full name" required>
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="Create a password" required>
            <button type="button" class="toggle-password" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
              <i class="fas fa-eye" id="passwordToggleIcon"></i>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label for="confirm_password">Confirm Password</label>
          <div class="password-wrapper">
            <input type="password" id="confirm_password" placeholder="Confirm your password" required>
            <button type="button" class="toggle-password" onclick="toggleConfirmPasswordVisibility()" aria-label="Toggle confirm password visibility">
              <i class="fas fa-eye" id="confirmPasswordToggleIcon"></i>
            </button>
          </div>
        </div>
        <div class="form-group">
          <div class="checkbox-group">
            <input type="checkbox" id="terms" required>
            <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
          </div>
        </div>

        <button type="submit" class="signup-btn">
          <i class="fas fa-user-plus"></i> Create Account
        </button>
      </form>

      <p class="login-link">
        Already have an account? <a href="login.html">Sign In</a>
      </p>

      <!-- Social Divider -->
      <div class="social-divider">
        <span class="line"></span>
        <span class="text">or continue with</span>
        <span class="line"></span>
      </div>

      <!-- Social Buttons -->
      <div class="social-buttons">
        <button class="social-btn-google" onclick="socialLogin('google')">
          <svg class="google-icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
            <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
            <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
            <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
            <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
          </svg>
          Google
        </button>
        <button class="social-btn-apple" onclick="socialLogin('apple')">
          <i class="fab fa-apple apple-icon"></i> Apple
        </button>
      </div>
    </div>
  </div>

  <!-- ===== JAVASCRIPT ===== -->
  <script>
    // ===== THEME TOGGLE =====
    let darkMode = false;
    function toggleTheme() {
      darkMode = !darkMode;
      const themeIcon = document.getElementById('themeToggle').querySelector('i');
      if (darkMode) {
        document.documentElement.setAttribute('data-theme', 'dark');
        themeIcon.className = 'fas fa-sun';
      } else {
        document.documentElement.removeAttribute('data-theme');
        themeIcon.className = 'fas fa-moon';
      }
    }

    // ===== RTL TOGGLE =====
    let rtlMode = false;
    function toggleRTL() {
      rtlMode = !rtlMode;
      const rtlLabel = document.getElementById('rtlLabel');
      if (rtlMode) {
        document.documentElement.setAttribute('dir', 'rtl');
        rtlLabel.textContent = 'LTR';
      } else {
        document.documentElement.removeAttribute('dir');
        rtlLabel.textContent = 'RTL';
      }
    }

    // ===== PASSWORD VISIBILITY TOGGLE =====
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const toggleIcon = document.getElementById('passwordToggleIcon');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.className = 'fas fa-eye-slash';
      } else {
        passwordInput.type = 'password';
        toggleIcon.className = 'fas fa-eye';
      }
    }

    // ===== CONFIRM PASSWORD VISIBILITY TOGGLE =====
    function toggleConfirmPasswordVisibility() {
      const confirmInput = document.getElementById('confirm_password');
      const toggleIcon = document.getElementById('confirmPasswordToggleIcon');
      
      if (confirmInput.type === 'password') {
        confirmInput.type = 'text';
        toggleIcon.className = 'fas fa-eye-slash';
      } else {
        confirmInput.type = 'password';
        toggleIcon.className = 'fas fa-eye';
      }
    }

    // ===== SIGNUP FORM HANDLER =====
    function handleSignup(e) {
      e.preventDefault();
      const fullname = document.getElementById('fullname').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm_password').value;
      const terms = document.getElementById('terms').checked;
      
      if (!fullname || !email || !password || !confirm) {
        alert('Please fill in all fields.');
        return false;
      }
      
      if (password !== confirm) {
        alert('Passwords do not match.');
        return false;
      }
      
      if (password.length < 6) {
        alert('Password must be at least 6 characters.');
        return false;
      }
      
      if (!terms) {
        alert('Please agree to the Terms of Service and Privacy Policy.');
        return false;
      }
      
      alert('Account created successfully! Please login.');
      window.location.href = 'login.html';
      return false;
    }

    // ===== SOCIAL LOGIN HANDLER =====
    function socialLogin(provider) {
      alert('You are signing up with ' + provider.charAt(0).toUpperCase() + provider.slice(1) + '. This feature is coming soon!');
    }

    // ===== CHECK FOR EXISTING THEME ON LOAD =====
    window.addEventListener('load', function() {
      if (document.documentElement.getAttribute('data-theme') === 'dark') {
        document.getElementById('themeToggle').querySelector('i').className = 'fas fa-sun';
        darkMode = true;
      }
      if (document.documentElement.getAttribute('dir') === 'rtl') {
        document.getElementById('rtlLabel').textContent = 'LTR';
        rtlMode = true;
      }
    });
  </script>

</body>
</html>
